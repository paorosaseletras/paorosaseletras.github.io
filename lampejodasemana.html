<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lampejo da Semana — Pão, Rosas e Letras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2E6C9; --paper-deep:#ECDCB3; --ink:#201209; --brown-deep:#201209;
    --terracotta:#A8291A; --clay:#C58E29; --gold:#C58E29; --line:#D8C7A0; --cream-card:#FFFAF0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Karla',sans-serif;line-height:1.6;
    background-image:radial-gradient(circle at 20% 10%, rgba(168,41,26,0.05), transparent 40%),radial-gradient(circle at 80% 90%, rgba(168,41,26,0.06), transparent 40%);
    min-height:100vh; display:flex; align-items:center;}
  .wrap{max-width:640px;margin:0 auto;padding:60px 28px;text-align:center;}
  .badge{width:96px;height:96px;margin:0 auto 26px;border-radius:50%;background:linear-gradient(135deg,var(--terracotta),var(--clay));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(32,18,9,0.18);}
  .badge svg{width:46px;height:46px;fill:var(--paper);}
  .eyebrow{letter-spacing:0.28em;text-transform:uppercase;font-size:12px;color:var(--terracotta);font-weight:700;margin-bottom:14px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(34px,7vw,48px);margin:0 0 16px;color:var(--brown-deep);}
  .pillar{font-family:'Fraunces',serif;font-style:italic;font-size:17px;color:var(--terracotta);margin-bottom:28px;}
  .soon{
    display:inline-block;
    background:var(--cream-card);
    border:1px dashed var(--clay);
    padding:14px 26px;
    border-radius:4px;
    font-size:14px;
    color:var(--ink);
    margin-bottom:30px;
  }
  .desc{font-size:15.5px;max-width:48ch;margin:0 auto 30px;opacity:0.85;}
  .backlink{display:inline-block;font-size:13px;color:var(--terracotta);text-decoration:none;border-bottom:1px dotted var(--terracotta);}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">
    <svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>
  </div>
  <div class="eyebrow">Série semanal · leveza & brevidade</div>
  <h1>Lampejo da Semana</h1>
  <div class="pillar">Leituras curtas que cabem em qualquer semana</div>
  <div class="soon">🚧 Página em construção — em breve com os posts desta série</div>
  <p class="desc">A série de leituras curtas — livros rápidos, intensos, que cabem numa tarde e deixam faísca.</p>
  <a class="backlink" href="index.html">← Voltar para a página inicial</a>
</div>
</body>
</html>
